## Version 2026/11/08
# SWAG proxy for ghcr.io/zedred79/handbrake-nvenc
# (based on SWAG's _template.subdomain.conf.sample)
#
# - copy this file to <swag config>/nginx/proxy-confs/handbrake.subdomain.conf
# - the handbrake container must be named "handbrake" and be on the same
#   docker network as SWAG (see ../docker-compose.swag.yml)
# - your DNS needs a record (or CNAME) for handbrake.<your domain>, and the
#   subdomain must be covered by the SWAG certificate (SUBDOMAINS=handbrake or
#   a wildcard)
#
# The web UI and the two websockets (/websockify = remote desktop,
# /ws-filemanager = file manager) are protected by the same authentication:
# if you change the auth method, change it in BOTH location blocks, otherwise
# the remote desktop is left open.

server {
    listen 443 ssl;
#    listen 443 quic;
    listen [::]:443 ssl;
#    listen [::]:443 quic;

    server_name handbrake.*;

    include /config/nginx/ssl.conf;

    # no limit on uploads through the web file manager
    client_max_body_size 0;

    # enable for ldap auth (requires ldap-location.conf in the location block)
    #include /config/nginx/ldap-server.conf;

    # enable for Authelia (requires authelia-location.conf in the location block)
    #include /config/nginx/authelia-server.conf;

    # enable for Authentik (requires authentik-location.conf in the location block)
    #include /config/nginx/authentik-server.conf;

    # enable for Tinyauth (requires tinyauth-location.conf in the location block)
    #include /config/nginx/tinyauth-server.conf;

    location / {
        # HTTP basic auth, enabled by default: the container itself has no
        # login. Create the user with
        #   docker exec -it swag htpasswd -c /config/nginx/.htpasswd <user>
        # If you use Authelia/Authentik/... instead, comment these two lines
        # and enable the matching includes.
        auth_basic "Restricted";
        auth_basic_user_file /config/nginx/.htpasswd;

        # enable for ldap auth (requires ldap-server.conf in the server block)
        #include /config/nginx/ldap-location.conf;

        # enable for Authelia (requires authelia-server.conf in the server block)
        #include /config/nginx/authelia-location.conf;

        # enable for Authentik (requires authentik-server.conf in the server block)
        #include /config/nginx/authentik-location.conf;

        # enable for Tinyauth (requires tinyauth-server.conf in the server block)
        #include /config/nginx/tinyauth-location.conf;

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app handbrake;
        set $upstream_port 5800;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # Websockets (remote desktop, file manager). proxy.conf is not included
    # here because its 240s timeouts would drop an idle session and cannot be
    # overridden in the same block; the headers it would set are listed below.
    location ~ /(websockify|ws-filemanager)$ {
        # same authentication as "location /" above
        auth_basic "Restricted";
        auth_basic_user_file /config/nginx/.htpasswd;
        #include /config/nginx/ldap-location.conf;
        #include /config/nginx/authelia-location.conf;
        #include /config/nginx/authentik-location.conf;
        #include /config/nginx/tinyauth-location.conf;

        include /config/nginx/resolver.conf;
        set $upstream_app handbrake;
        set $upstream_port 5800;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        proxy_buffering off;
    }
}
